name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: duitflow_test
          POSTGRES_PASSWORD: synthetic_ci_password
          POSTGRES_DB: duitflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duitflow_test -d duitflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Disposable local CI database only, never production credentials.
      DIRECT_URL: postgresql://duitflow_test:synthetic_ci_password@localhost:5432/duitflow_test
      DATABASE_URL: postgresql://duitflow_test:synthetic_ci_password@localhost:5432/duitflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
